

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>School Application System</title>
</head>
<body>
    <div class="nav-container">
        <ul class="navList">
            <li>Home</li>
            <li>Register</li>
            <li>Login</li>
        </ul>
        <ul class="left">
            <img src=""
        </ul>
    </div>
    <div class="container">
        <h1>Parent Registration</h1>
        <form id="registrationForm">
            <input type="text" id="regUsername" placeholder="Username" required>
            <input type="email" id="regEmail" placeholder="Email" required>
            <input type="password" id="regPassword" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>

        <h1>Login</h1>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div id="message"></div>

        <div id="applicationContainer" style="display: none;">
            <h1>Application Form</h1>
            <form id="applicationForm">
                <input type="text" id="studentName" placeholder="Child's Name" required>
                <input type="date" id="studentDOB" placeholder="Date of Birth" required>
                <input type="text" id="previousSchool" placeholder="Previous School" required>
                <input type="file" id="reportCard" accept=".pdf,.jpg,.jpeg,.png" required>
                <button type="submit">Submit Application</button>
            </form>
            <div id="applicationStatus" style="display: none;"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
